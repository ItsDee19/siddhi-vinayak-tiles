<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Generated from public/logo-emblem.png by scripts/build_favicons.mjs.
         There is no SVG icon: the emblem is raster artwork, and the previous
         favicon.svg was an unrelated "SVT" placeholder that browsers preferring
         SVG would have kept showing in place of these. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sidhhi Binayak Tiles, Nuapada — premium Tiles, Marble, Granite, Quartz & Sanitaryware. Enter as Friend, Leave as Family."
    />
    <meta name="theme-color" content="#2C1A0E" />

    <!-- Fonts: Playfair Display (display serif) + Manrope (body sans).
         Loaded without blocking the first paint: as a plain stylesheet this is a
         render-blocking round trip to a third-party origin before anything can
         appear on screen. Swapping media to "all" once it arrives keeps the
         request but takes it off the critical path — the URL already carries
         display=swap, so text was always going to swap in once the face landed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Brand name only. The keywords that used to be appended here for search
         engines live in the meta description above, which is what actually
         gets shown as the snippet. -->
    <title>Sidhhi Binayak Tiles</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
